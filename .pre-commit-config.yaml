exclude: "^docs/|config/|lib/"
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-gcode-params
        name: Check gcode command param declarations
        entry: python3 scripts/check_gcode_params.py
        language: system
        files: ^klippy/.*\.py$
