# Test config for corexy precise homing with sensorless X and Y
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 200
position_max: 200
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PA5
diag_pin: PE5
run_current: .5
sense_resistor: 0.110
driver_SGTHRS: 100

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 200
position_max: 200
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC0
diag_pin: PJ1
run_current: .5
sense_resistor: 0.110
driver_SGTHRS: 100

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PD7
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[corexy_precise_homing]
backoff_distance: 5
samples: 2
